<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#00324a" />
  <meta name="description" content="Velorah — цифровые пространства для глубоких мыслителей, смелых авторов и тихих бунтарей." />
  <title>Velorah — путь сквозь тишину</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Instrument+Serif&family=Inter:wght@400;500&display=swap');

    :root {
      --font-display: "Cormorant Garamond", "Instrument Serif", Georgia, serif;
      --font-body: "Inter", sans-serif;
      --background: 201 100% 13%;
      --foreground: 0 0% 100%;
      --muted-foreground: 240 4% 66%;
      --primary: 0 0% 100%;
      --primary-foreground: 0 0% 4%;
      --secondary: 0 0% 10%;
      --muted: 0 0% 10%;
      --accent: 0 0% 10%;
      --border: 0 0% 18%;
      --input: 0 0% 18%;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; background: hsl(var(--background)); }
    body {
      margin: 0;
      overflow: hidden;
      color: hsl(var(--foreground));
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, a { color: inherit; font: inherit; }
    button { border: 0; }
    a { text-decoration: none; }
    ::selection { background: hsl(var(--foreground)); color: hsl(var(--primary-foreground)); }

    .hero-page {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: hsl(var(--background));
    }
    .background-video {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .liquid-glass {
      position: relative;
      overflow: hidden;
      border: none;
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }
    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }

    .navigation {
      position: relative;
      z-index: 10;
      display: flex;
      width: min(100%, 1280px);
      align-items: center;
      justify-content: space-between;
      margin: 0 auto;
      padding: 24px 32px;
    }
    .logo {
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 2.4vw, 2.35rem);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1;
    }
    .logo sup { position: relative; top: -.66em; margin-left: 2px; font-family: var(--font-body); font-size: .42em; letter-spacing: 0; }
    .nav-links { display: flex; align-items: center; gap: clamp(22px, 3vw, 42px); }
    .nav-links a { color: hsl(var(--muted-foreground)); font-size: .82rem; font-weight: 400; transition: color 200ms ease; }
    .nav-links a:hover, .nav-links a.is-active { color: hsl(var(--foreground)); }
    .nav-cta {
      border-radius: 999px;
      padding: 11px 25px;
      color: hsl(var(--foreground));
      cursor: pointer;
      font-size: .82rem;
      transition: transform 220ms ease, background 220ms ease;
    }
    .nav-cta:hover { transform: scale(1.03); background: rgba(255,255,255,.035); }

    .hero-content {
      position: relative;
      z-index: 10;
      display: flex;
      min-height: calc(100svh - 95px);
      align-items: center;
      flex-direction: column;
      justify-content: center;
      padding: 90px 24px 140px;
      text-align: center;
    }
    .hero-heading {
      max-width: 1220px;
      margin: 0;
      color: hsl(var(--foreground));
      font-family: var(--font-display);
      font-size: clamp(3.25rem, 7.5vw, 7.4rem);
      font-weight: 400;
      letter-spacing: -2.46px;
      line-height: .95;
      text-wrap: balance;
    }
    .hero-heading em { color: hsl(var(--muted-foreground)); font-style: normal; }
    .hero-subtext {
      max-width: 690px;
      margin: 32px 0 0;
      color: hsl(var(--muted-foreground));
      font-size: clamp(1rem, 1.35vw, 1.16rem);
      line-height: 1.7;
      text-wrap: balance;
    }
    .hero-cta {
      border-radius: 999px;
      margin-top: 46px;
      padding: 20px 56px;
      color: hsl(var(--foreground));
      cursor: pointer;
      font-size: 1rem;
      transition: transform 220ms ease, background 220ms ease;
    }
    .hero-cta:hover { transform: scale(1.03); background: rgba(255,255,255,.035); }

    @keyframes fade-rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-rise { animation: fade-rise .8s ease-out both; }
    .animate-fade-rise-delay { animation: fade-rise .8s ease-out .2s both; }
    .animate-fade-rise-delay-2 { animation: fade-rise .8s ease-out .4s both; }

    @media (max-width: 760px) {
      .navigation { padding: 20px 18px; }
      .nav-links { display: none; }
      .logo { font-size: 1.85rem; }
      .nav-cta { padding: 10px 18px; font-size: .73rem; }
      .hero-content { min-height: calc(100svh - 80px); padding: 80px 18px 115px; }
      .hero-heading { font-size: clamp(3rem, 14vw, 5.1rem); letter-spacing: -1.6px; }
      .hero-subtext { max-width: 520px; font-size: .88rem; line-height: 1.6; }
      .hero-cta { margin-top: 38px; padding: 17px 42px; font-size: .87rem; }
    }

    @media (max-height: 680px) {
      .navigation { padding-top: 16px; padding-bottom: 16px; }
      .hero-content { padding-top: 50px; padding-bottom: 80px; }
      .hero-heading { font-size: clamp(3rem, 10vh, 5.4rem); }
      .hero-subtext { margin-top: 23px; }
      .hero-cta { margin-top: 28px; padding-top: 15px; padding-bottom: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="hero-page">
    <video
      class="background-video"
      src="https://storage.yandexcloud.net/promto-user-static-sites-prod/landing-videos/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
    ></video>

    <header class="navigation">
      <a class="logo" href="#home" aria-label="Velorah — главная">Velorah<sup>®</sup></a>
      <nav class="nav-links" aria-label="Основная навигация">
        <a class="is-active" href="#home">Главная</a>
        <a href="#studio">Студия</a>
        <a href="#about">О нас</a>
        <a href="#journal">Журнал</a>
        <a href="#contact">Связаться</a>
      </nav>
      <button class="nav-cta liquid-glass" type="button">Начать путь</button>
    </header>

    <section class="hero-content" id="home">
      <h1 class="hero-heading animate-fade-rise">Там, где <em>мечты</em><br />поднимаются <em>сквозь тишину.</em></h1>
      <p class="hero-subtext animate-fade-rise-delay">Мы создаём инструменты для глубоких мыслителей, смелых авторов и тихих бунтарей. Среди хаоса мы строим цифровые пространства для ясного фокуса и вдохновенной работы.</p>
      <button class="hero-cta liquid-glass animate-fade-rise-delay-2" type="button">Начать путь</button>
      <span id="studio" hidden></span><span id="about" hidden></span><span id="journal" hidden></span><span id="contact" hidden></span>
    </section>
  </main>

  <script>
    (() => {
      const hero = document.getElementById('home');
      document.querySelectorAll('.nav-cta, .hero-cta').forEach((button) => {
        button.addEventListener('click', () => {
          hero.querySelector('.hero-subtext').animate(
            [
              { opacity: 1, transform: 'translateY(0)' },
              { opacity: .45, transform: 'translateY(-3px)' },
              { opacity: 1, transform: 'translateY(0)' }
            ],
            { duration: 520, easing: 'ease-out' }
          );
        });
      });
    })();
  </script>
</body>
</html>
