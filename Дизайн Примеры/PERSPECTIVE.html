<script>
  (function() {
    var mouse = { x: 0, y: 0 };
    var panel = document.getElementById('parallax-panel');
    var bg = document.getElementById('parallax-bg');

    window.addEventListener('mousemove', function(e) {
      mouse.x = (e.clientX / window.innerWidth - 0.5) * 20;
      mouse.y = -((e.clientY / window.innerHeight - 0.5) * 20);

      panel.style.transform =
        'rotateY(' + (-12 + 0.5 * mouse.x) + 'deg) ' +
        'rotateX(' + (4 + 0.5 * mouse.y) + 'deg) ' +
        'scale(0.95)';

      bg.style.transform =
        'translate(' + (-1 * mouse.x) + 'px, ' + mouse.y + 'px) scale(1.05)';
    });
  })();
</script>
